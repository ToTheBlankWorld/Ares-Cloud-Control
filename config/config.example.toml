[server]
host = "127.0.0.1"
port = 9000

[monitoring]
interval_ms = 1000
process_limit = 100

[auth]
token_file = "/etc/remotebtop/token"

[gpu]
# Disabled by default for security - enable if you have NVIDIA GPU with NVML
enabled = false

[docker]
# Disabled by default for security - Docker socket access is highly privileged
# If enabling, use ACL or socket proxy instead of adding user to 'docker' group
enabled = false
socket = "/var/run/docker.sock"