[server]
host = "127.0.0.1"
port = 9000

[monitoring]
interval_ms = 1000
process_limit = 100

[auth]
token_file = "/etc/remotebtop/token"

[gpu]
# Disabled by default for security - enable if you have NVIDIA GPU with NVML
enabled = false

[docker]
# Disabled by default for security - Docker socket access is highly privileged
# If enabling, use ACL or socket proxy instead of adding user to 'docker' group
enabled = false
socket = "/var/run/docker.sock"

[cors]
# Allowed origins for CORS. Empty = allow all (development only).
# For production, specify the dashboard origin(s) explicitly:
# allowed_origins = ["https://your-dashboard.vercel.app"]
# For local development:
# allowed_origins = ["http://localhost:5173"]
allowed_origins = []

# HTTP methods allowed for cross-origin requests
allowed_methods = ["GET", "POST", "OPTIONS"]

# Headers allowed for cross-origin requests
allowed_headers = ["Authorization", "Content-Type"]

# Allow credentials (cookies, auth headers) in cross-origin requests
allow_credentials = false

# Max age for preflight cache in seconds (default: 24 hours)
max_age = 86400